<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" routerLink="/" aria-label="CompanyLens home">
      <span class="brand__mark" aria-hidden="true">
        <ng-icon name="lucideBuilding2" size="20" />
      </span>
      <span>CompanyLens</span>
    </a>
    <div class="header-actions">
      <nav aria-label="Primary navigation">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          >Search</a
        >
        <a routerLink="/logs" routerLinkActive="active">Activity log</a>
      </nav>
      <img class="header-partner" src="/deloitte-logo.png" alt="Deloitte" width="128" height="27" />
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer>
  <p>Company data is retrieved from Companies House through the secure backend service.</p>
</footer>
